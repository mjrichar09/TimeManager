<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #f2f2ef; -webkit-font-smoothing: antialiased; }
    a { color: #2a78d6; text-decoration: none; } a:hover { color: #1c5cab; }
    .t { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-feature-settings: 'tnum' 1; }
    .seg { appearance: none; padding: 0; border: 0; cursor: pointer; display: block; height: 100%; }
    .gap { background-image: repeating-linear-gradient(135deg, #f5cfce 0 4px, #fbeceb 4px 8px); }
    .chip { appearance: none; font: inherit; font-size: 12px; padding: 11px 10px; cursor: pointer;
            border: 1px solid #dcdbd4; background: #fcfcfb; color: #141414; text-align: left; line-height: 1.2; }
    .chip:hover { border-color: #b9b8b0; }
    .step { appearance: none; width: 46px; height: 46px; border: 1px solid #cbcac2; background: #fcfcfb;
            font: inherit; font-size: 17px; color: #141414; cursor: pointer; }
    .step:active { background: #eceae4; }
  </style>
</helmet>

<div class="t" style="width: 390px; height: 844px; background: #f2f2ef; color: #141414; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 22px 16px 14px;">
    <div class="m" style="font-size: 10px; letter-spacing: 0.14em; color: #8d8c85;">RECONCILE · TUE 22 AUG</div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px;">
      <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.015em;">{{day.logged}} logged</div>
      <div class="m" style="font-size: 13px; color: {{day.gapColor}};">{{day.gapText}}</div>
    </div>
  </div>

  <div style="padding: 0 16px;">
    <div style="display: flex; gap: 2px; height: 104px; background: #fcfcfb; border: 1px solid #d9d8d2; padding: 2px;">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="17">
        <button class="seg {{s.cls}}" onClick="{{s.pick}}" style="flex-grow: {{s.grow}}; flex-basis: 0; background: {{s.bg}}; box-shadow: {{s.ring}};"></button>
      </sc-for>
    </div>
    <div class="m" style="display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.08em; color: #8d8c85; margin-top: 6px;">
      <span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
    </div>
  </div>

  <div style="margin: 16px 16px 0; background: #fcfcfb; border: 1px solid #d9d8d2; padding: 16px;">
    <div class="m" style="font-size: 10px; letter-spacing: 0.14em; color: {{sel.kickerColor}};">{{sel.kicker}}</div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px;">
      <div style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em;">{{sel.name}}</div>
      <div class="m" style="font-size: 13px; color: #5a5954;">{{sel.range}}</div>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 14px; padding-top: 14px; border-top: 1px solid #e6e5df;">
      <div>
        <div class="m" style="font-size: 9px; letter-spacing: 0.12em; color: #8d8c85;">START</div>
        <div style="display: flex; gap: 6px; align-items: center; margin-top: 6px;">
          <button class="step" onClick="{{sel.startBack}}">&#8722;</button>
          <button class="step" onClick="{{sel.startFwd}}">+</button>
        </div>
      </div>
      <div>
        <div class="m" style="font-size: 9px; letter-spacing: 0.12em; color: #8d8c85;">END</div>
        <div style="display: flex; gap: 6px; align-items: center; margin-top: 6px;">
          <button class="step" onClick="{{sel.endBack}}">&#8722;</button>
          <button class="step" onClick="{{sel.endFwd}}">+</button>
        </div>
      </div>
      <div style="margin-left: auto; text-align: right;">
        <div class="m" style="font-size: 9px; letter-spacing: 0.12em; color: #8d8c85;">LENGTH</div>
        <div class="m" style="font-size: 21px; font-weight: 500; margin-top: 4px; letter-spacing: -0.02em;">{{sel.len}}</div>
      </div>
    </div>

    <div class="m" style="font-size: 9px; letter-spacing: 0.12em; color: #8d8c85; margin-top: 16px;">{{sel.recatLabel}}</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 8px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="10">
        <button class="chip" onClick="{{c.pick}}" style="background: {{c.bg}}; color: {{c.fg}}; border-color: {{c.border}};">{{c.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; padding: 16px; border-top: 1px solid #d9d8d2;">
    <button onClick="{{complete}}" style="appearance: none; width: 100%; padding: 17px; font: inherit; font-size: 15px; cursor: pointer; border: 1px solid {{day.ctaBorder}}; background: {{day.ctaBg}}; color: {{day.ctaFg}};">{{day.cta}}</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cats = {
      meals:   { name: 'Meals',            energy: 0 },
      kidsl:   { name: 'Kids — logistics', energy: -1 },
      kidsa:   { name: 'Kids — active',    energy: 1 },
      commute: { name: 'Commute',          energy: -1 },
      email:   { name: 'Email / admin',    energy: -1 },
      deep:    { name: 'Deep work',        energy: 1 },
      meet:    { name: 'Meetings',         energy: -1 },
      chores:  { name: 'Household chores', energy: -1 },
      media:   { name: 'Media / scroll',   energy: -1 },
      sleep:   { name: 'Sleep',            energy: 0 }
    };
    const raw = [
      ['meals', 360, 400], ['kidsl', 400, 445], ['commute', 445, 485], ['email', 485, 552],
      ['deep', 552, 664], [null, 664, 680], ['meet', 680, 730], ['meals', 730, 765],
      ['deep', 765, 870], ['meet', 870, 915], [null, 915, 940], ['email', 940, 990],
      ['commute', 990, 1050], ['kidsa', 1050, 1125], ['meals', 1125, 1170],
      ['chores', 1170, 1230], ['media', 1230, 1305], ['sleep', 1305, 1440]
    ];
    this.state = {
      segs: raw.map(function (r) { return { cat: r[0], start: r[1], end: r[2] }; }),
      sel: 5,
      done: false
    };
  }

  fmt(min) {
    return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
  }
  dur(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return h > 0 ? h + 'h ' + (m > 0 ? String(m).padStart(2, '0') + 'm' : '') : m + 'm';
  }
  fill(cat, selected) {
    if (cat === null) return null;
    const e = this.cats[cat].energy;
    if (selected) return e > 0 ? '#7fb0ea' : e < 0 ? '#ef9a99' : '#c9c7bd';
    return e > 0 ? '#cfdff6' : e < 0 ? '#f7d5d4' : '#e4e3dd';
  }

  move(index, edge, delta) {
    const segs = this.state.segs.map(function (s) { return { cat: s.cat, start: s.start, end: s.end }; });
    const cur = segs[index];
    if (edge === 'start') {
      const prev = segs[index - 1];
      const next = cur.start + delta;
      if (!prev || next >= cur.end - 5 || next <= prev.start + 5) return;
      cur.start = next; prev.end = next;
    } else {
      const nxt = segs[index + 1];
      const next = cur.end + delta;
      if (!nxt || next <= cur.start + 5 || next >= nxt.end - 5) return;
      cur.end = next; nxt.start = next;
    }
    this.setState({ segs: segs });
  }

  recat(catId) {
    const segs = this.state.segs.map(function (s) { return { cat: s.cat, start: s.start, end: s.end }; });
    segs[this.state.sel].cat = catId;
    this.setState({ segs: segs });
  }

  renderVals() {
    const self = this;
    const segs = this.state.segs;
    const sel = segs[this.state.sel];
    const selIsGap = sel.cat === null;
    const gapMin = segs.reduce(function (a, s) { return a + (s.cat === null ? s.end - s.start : 0); }, 0);
    const gapCount = segs.filter(function (s) { return s.cat === null; }).length;
    const loggedMin = segs.reduce(function (a, s) { return a + (s.cat !== null ? s.end - s.start : 0); }, 0);

    return {
      day: {
        logged: this.dur(loggedMin),
        gapText: gapCount === 0 ? 'no gaps' : gapCount + ' gaps · ' + gapMin + 'm',
        gapColor: gapCount === 0 ? '#5a5954' : '#c0392b',
        cta: this.state.done ? 'Day complete — go to check' : gapCount === 0 ? 'Mark day complete' : 'Mark day complete anyway',
        ctaBg: this.state.done ? '#eceae5' : '#141414',
        ctaFg: this.state.done ? '#5a5954' : '#fcfcfb',
        ctaBorder: this.state.done ? '#cbcac2' : '#141414'
      },
      segs: segs.map(function (s, i) {
        const selected = i === self.state.sel;
        return {
          grow: String(s.end - s.start),
          cls: s.cat === null ? 'gap' : '',
          bg: s.cat === null ? 'transparent' : self.fill(s.cat, selected),
          ring: selected ? 'inset 0 0 0 2px #141414' : 'none',
          pick: function () { self.setState({ sel: i }); }
        };
      }),
      sel: {
        kicker: selIsGap ? 'UNLOGGED GAP' : 'SELECTED BLOCK',
        kickerColor: selIsGap ? '#c0392b' : '#8d8c85',
        name: selIsGap ? 'Nothing recorded' : this.cats[sel.cat].name,
        range: this.fmt(sel.start) + ' – ' + this.fmt(sel.end),
        len: this.dur(sel.end - sel.start),
        recatLabel: selIsGap ? 'FILL WITH' : 'RECATEGORISE',
        startBack: function () { self.move(self.state.sel, 'start', -5); },
        startFwd: function () { self.move(self.state.sel, 'start', 5); },
        endBack: function () { self.move(self.state.sel, 'end', -5); },
        endFwd: function () { self.move(self.state.sel, 'end', 5); }
      },
      cats: Object.keys(this.cats).map(function (id) {
        const active = sel.cat === id;
        return {
          name: self.cats[id].name,
          bg: active ? '#141414' : '#fcfcfb',
          fg: active ? '#fcfcfb' : '#141414',
          border: active ? '#141414' : '#dcdbd4',
          pick: function () { self.recat(id); }
        };
      }),
      complete: function () { self.setState({ done: true }); }
    };
  }
}
</script>
</body>
</html>
